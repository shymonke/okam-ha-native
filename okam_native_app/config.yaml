name: O-KAM Native Bridge
version: 1.3.0
slug: okam_native
description: Self-contained native O-KAM camera bridge for Home Assistant
url: https://github.com/shymonke/okam-ha-native
image: ghcr.io/shymonke/okam-ha-native
arch:
  - aarch64
  - amd64
startup: application
boot: auto
watchdog: http://[HOST]:[PORT:8099]/health
homeassistant_api: true
map:
  - addon_config:rw
discovery:
  - okam
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Native runtime status API
options:
  guest_tokens: []
  camera_id: cabin
  idle_timeout_seconds: 120
  always_on: false
  run_connect_test: false
  run_auth_test: false
  run_stream_test: false
  run_snapshot_test: false
schema:
  account_username: email?
  account_password: password?
  camera_password: password?
  vp_password_salt: password?
  api_token: password?
  guest_tokens:
    - name: str?
      token: password?
  camera_id: "match(^[A-Za-z0-9_-]{1,32}$)"
  idle_timeout_seconds: "int(10,600)"
  always_on: bool
  run_connect_test: bool
  run_auth_test: bool
  run_stream_test: bool
  run_snapshot_test: bool
