name: Publish native bridge image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Required suffix for a test build, e.g. test1."
        required: true
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-okam-native
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
      move_latest: ${{ steps.app.outputs.move_latest }}
    steps:
      - uses: actions/checkout@v6
      - name: Read app version
        id: app
        shell: bash
        env:
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          set -eu
          base="$(sed -n 's/^version: //p' okam_native_app/config.yaml)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$base" ]; then
              echo "Release tag must match the app version." >&2
              exit 1
            fi
            echo "version=${base}" >> "$GITHUB_OUTPUT"
          else
            if [ -z "${TAG_SUFFIX:-}" ]; then
              echo "Manual builds require a test suffix." >&2
              exit 1
            fi
            echo "version=${base}-${TAG_SUFFIX}" >> "$GITHUB_OUTPUT"
          fi
          # Only a pushed plain version tag may move latest.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] \
             && [[ "${GITHUB_REF}" == refs/tags/v* ]] \
             && [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "move_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "move_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: aarch64
            platform: linux/arm64
            docker_arch: arm64
          - ha_arch: amd64
            platform: linux/amd64
            docker_arch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.ha_arch }} app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./okam_native_app/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/shymonke/okam-ha-native:${{ needs.prepare.outputs.version }}-${{ matrix.ha_arch }}
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_ARCH=${{ matrix.ha_arch }}
            TARGETARCH=${{ matrix.docker_arch }}
          cache-from: type=gha,scope=${{ matrix.ha_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ha_arch }}

  publish:
    needs: [prepare, tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MOVE_LATEST: ${{ needs.prepare.outputs.move_latest }}
        run: |
          set -eu
          image="ghcr.io/shymonke/okam-ha-native"
          tags=(--tag "$image:$VERSION")
          if [ "$MOVE_LATEST" = "true" ]; then
            tags+=(--tag "$image:latest")
          else
            echo "Leaving :latest untouched; publishing $VERSION only."
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:$VERSION-aarch64" \
            "$image:$VERSION-amd64"
          docker buildx imagetools inspect "$image:$VERSION"
